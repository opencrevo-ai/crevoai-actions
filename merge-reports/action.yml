name: Merge and Publish Playwright Reports
description: Download blob reports, merge them, publish JUnit results, and upload artifacts

inputs:
  html-retention-days:
    required: false
    default: "14"
  report-name:
    required: false
    default: "playwright test results"

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: blob-report-*
        path: all-blob-reports
        merge-multiple: true

    - shell: bash
      run: |
        mkdir -p test-results
        npx playwright merge-reports --reporter=html,json,junit ./all-blob-reports
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json
        PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/results.xml

    - if: always()
      uses: dorny/test-reporter@v1
      with:
        name: ${{ inputs.report-name }}
        path: test-results/results.xml
        reporter: java-junit
        fail-on-error: false

    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: ${{ inputs.html-retention-days }}

    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-json
        path: test-results/results.json

    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: test-results/
